<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact White Water Rafting company for reservations, questions, and support.">
  <meta name="author" content="he1dengg">
  <title>Contact Us | White Water Rafting</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <img src="images/logo.png" alt="Rafting Logo">

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main>
    <h1>Contact White Water Rafting</h1>

    <!-- COMPANY INFO -->
    <section>
      <h2>Our Office</h2>
      <p>📍 123 River Road, Adventure City</p>
      <p>📞 +1 234 567 890</p>
      <p>📧 info@whitewaterrafting.com</p>
    </section>

    <!-- MAP IMAGE -->
    <section>
      <h2>Find Us</h2>
      <img src="images/map.jpg" alt="Map showing rafting company location">
    </section>

    <!-- EMPLOYEES -->
    <section>
      <h2>Meet Our Team</h2>

      <figure>
        <img src="images/guide1.jpg" alt="Rafting guide leading a group on the river">
        <figcaption>John - Lead Guide</figcaption>
      </figure>

      <figure>
        <img src="images/guide2.jpg" alt="Instructor teaching rafting safety techniques">
        <figcaption>Sarah - Instructor</figcaption>
      </figure>

      <figure>
        <img src="images/guide3.jpg" alt="Rafting manager supervising operations">
        <figcaption>Mike - Manager</figcaption>
      </figure>

      <!-- EXTRA IMAGE (to pass requirement >=5) -->
      <figure>
        <img src="images/office.jpg" alt="Rafting company office building">
        <figcaption>Our Main Office</figcaption>
      </figure>
    </section>

    <!-- CONTACT FORM -->
    <section>
      <h2>Contact Form</h2>

      <form>
        <!-- NAME -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">

        <!-- EMAIL -->
        <label for="email">Email:</label>
        <input type="text" id="email" name="email">

        <!-- RADIO -->
        <p>Inquiry Type:</p>

        <input type="radio" id="general" name="inquiry" value="general">
        <label for="general">General Question</label>

        <input type="radio" id="reservation" name="inquiry" value="reservation">
        <label for="reservation">Reservation</label>

        <input type="radio" id="support" name="inquiry" value="support">
        <label for="support">Support</label>

        <!-- MESSAGE -->
        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea>

        <!-- CHECKBOX -->
        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe to newsletter</label>

        <!-- SUBMIT -->
        <button type="submit">Send Message</button>
      </form>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 White Water Rafting | he1dengg</p>

    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.png" alt="Facebook">
      </a>
      <a href="https://twitter.com">
        <img src="images/twitter.png" alt="Twitter">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.png" alt="Instagram">
      </a>
    </nav>
  </footer>

</body>
</html>
